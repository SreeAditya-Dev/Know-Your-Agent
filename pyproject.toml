[project]
name = "kya"
version = "0.1.0"
description = "Know-Your-Agent — an obligation-clearing gateway for agentic commerce on Razorpay rails"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43",
    "httpx>=0.27",
    "razorpay>=1.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.20"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "kya.api.app:app"

[tool.setuptools.packages.find]
include = ["kya*", "redteam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "attack: red-team attack scenario",
    "legit: legitimate traffic scenario",
    "live: requires live Razorpay test-mode credentials",
]
